<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
  <title>Tower Defense: Last Grid</title>
  <meta name="theme-color" content="#05070d">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      outline: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      background-color: #05070d;
      color: #00e5ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, monospace, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
      border: none;
      box-shadow: none;
    }
    #game-canvas {
      display: block;
      touch-action: none;
      -webkit-touch-callout: none;
      cursor: crosshair;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    #mech-hangar-canvas {
      position: absolute;
      display: none;
      pointer-events: auto;
      touch-action: none;
      cursor: grab;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
    <canvas id="mech-hangar-canvas" width="370" height="340"></canvas>
  </div>
  <script src="libs/three.min.js"></script>
  <script src="apex_mech.js"></script>
  <script src="game.js"></script>
</body>
</html>
