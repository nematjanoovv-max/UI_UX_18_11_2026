<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tactical Operator — 3D Character Studio</title>
<style>
  :root {
    --bg-dark: #0a0c12;
    --panel-bg: rgba(14, 18, 26, 0.88);
    --panel-border: rgba(0, 240, 255, 0.25);
    --cyan: #00f0ff;
    --cyan-glow: rgba(0, 240, 255, 0.35);
    --orange: #ff9d00;
    --text: #e6edf3;
    --text-dim: #8b949e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg-dark);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    color: var(--text);
  }
  #webgl-canvas {
    width: 100%; height: 100%;
    display: block;
  }
  
  /* Top Header HUD */
  #header-hud {
    position: absolute;
    top: 16px; left: 16px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px 18px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    pointer-events: auto;
  }
  #header-hud h1 {
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #header-hud h1::before {
    content: '';
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--cyan);
  }
  #header-hud .subtitle {
    font-size: 11px;
    color: var(--text-dim);
  }

  /* Right Stats Panel */
  #stats-panel {
    position: absolute;
    top: 16px; right: 16px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 12px;
    min-width: 220px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding-bottom: 4px;
  }
  .stat-row:last-child { border-bottom: none; margin-bottom: 0; }
  .stat-label { color: var(--text-dim); }
  .stat-val { color: var(--cyan); font-weight: bold; }

  /* Bottom Animation Dock */
  #anim-dock {
    position: absolute;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 10px 16px;
    display: flex;
    gap: 10px;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }
  .btn-anim {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(0, 240, 255, 0.3);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-anim:hover {
    background: rgba(0, 240, 255, 0.15);
    border-color: var(--cyan);
    color: var(--cyan);
  }
  .btn-anim.active {
    background: var(--cyan);
    color: #000;
    border-color: var(--cyan);
    box-shadow: 0 0 16px var(--cyan-glow);
  }

  /* Left Floating Tools */
  #tools-dock {
    position: absolute;
    bottom: 24px; left: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tool-btn {
    background: var(--panel-bg);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.2s;
  }
  .tool-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .tool-btn.active { border-color: var(--cyan); background: rgba(0,240,255,0.2); color: var(--cyan); }

  /* Loading Spinner */
  #loader-overlay {
    position: absolute;
    inset: 0;
    background: #0a0c12;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    z-index: 100;
    transition: opacity 0.4s ease;
  }
  .spinner {
    width: 44px; height: 44px;
    border: 3px solid rgba(0, 240, 255, 0.2);
    border-top-color: var(--cyan);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="loader-overlay">
  <div class="spinner"></div>
  <div style="font-size:13px; letter-spacing:0.1em; color:var(--cyan);">TACTICAL OPERATOR YUKLANMOQDA...</div>
</div>

<canvas id="webgl-canvas"></canvas>

<!-- Header HUD -->
<div id="header-hud">
  <h1>Tactical Operator</h1>
  <div class="subtitle">3D AAA Personaj · 360° Interaktiv Ko'rish</div>
</div>

<!-- Stats Panel -->
<div id="stats-panel">
  <div class="stat-row"><span class="stat-label">Model:</span><span class="stat-val">tactical_operator.glb</span></div>
  <div class="stat-row"><span class="stat-label">Bo'yi (Height):</span><span class="stat-val">1.75 m</span></div>
  <div class="stat-row"><span class="stat-label">Hajmi (Optimized):</span><span class="stat-val">165 KB</span></div>
  <div class="stat-row"><span class="stat-label">Siqilish (Meshopt):</span><span class="stat-val">-76.5%</span></div>
  <div class="stat-row"><span class="stat-label">Format:</span><span class="stat-val">GLTF 2.0 Binary</span></div>
  <div class="stat-row"><span class="stat-label">Holat:</span><span class="stat-val" id="stat-anim">IDLE</span></div>
</div>

<!-- Animation Dock -->
<div id="anim-dock">
  <button class="btn-anim active" data-anim="idle">IDLE</button>
  <button class="btn-anim" data-anim="walk">WALK</button>
  <button class="btn-anim" data-anim="run">RUN</button>
  <button class="btn-anim" data-anim="jump">JUMP</button>
</div>

<!-- Tools Dock -->
<div id="tools-dock">
  <button class="tool-btn" id="btn-wireframe">Wireframe: OFF</button>
  <button class="tool-btn" id="btn-rotate">Auto-Rotate: ON</button>
  <button class="tool-btn" id="btn-lighting">Chiroq: Studio Cyber</button>
  <button class="tool-btn" id="btn-reset">Kamera Qaytarish</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const canvas = document.getElementById('webgl-canvas');
const loaderOverlay = document.getElementById('loader-overlay');
const statAnim = document.getElementById('stat-anim');

// 1. Scene & Camera Setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c12);
scene.fog = new THREE.FogExp2(0x0a0c12, 0.08);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.3, 3.2);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

// OrbitControls
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0.95, 0);
controls.maxPolarAngle = Math.PI / 2 + 0.05; // Don't go completely below floor
controls.minDistance = 0.8;
controls.maxDistance = 6.0;

// 2. Tactical Studio Lighting
const ambientLight = new THREE.AmbientLight(0xdde6ed, 0.6);
scene.add(ambientLight);

// Key Light (Cold Tactical Cyan)
const keyLight = new THREE.DirectionalLight(0x00f0ff, 1.8);
keyLight.position.set(2.5, 3.5, 2.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 1024;
keyLight.shadow.mapSize.height = 1024;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 10;
keyLight.shadow.bias = -0.001;
scene.add(keyLight);

// Fill Light (Warm Tactical Orange)
const fillLight = new THREE.DirectionalLight(0xff9933, 1.0);
fillLight.position.set(-3.0, 2.0, -1.5);
scene.add(fillLight);

// Rim Light (Sharp Top Accent)
const rimLight = new THREE.DirectionalLight(0xffffff, 1.5);
rimLight.position.set(0, 4.0, -2.5);
scene.add(rimLight);

// Tactical Circular Ground Grid
const gridHelper = new THREE.GridHelper(6, 24, 0x00f0ff, 0x1f293d);
gridHelper.position.y = 0.001;
scene.add(gridHelper);

// Floor Shadow Receiver
const floorGeo = new THREE.PlaneGeometry(10, 10);
const floorMat = new THREE.ShadowMaterial({ opacity: 0.45 });
const floorMesh = new THREE.Mesh(floorGeo, floorMat);
floorMesh.rotation.x = -Math.PI / 2;
floorMesh.receiveShadow = true;
scene.add(floorMesh);

// 3. Load GLB Model
let characterMesh = null;
let mixer = null;
let currentAnim = 'idle';
let animTime = 0;
let isWireframe = false;
let autoRotate = true;

const gltfLoader = new GLTFLoader();
gltfLoader.setMeshoptDecoder(MeshoptDecoder);

const modelUrl = 'assets/characters/tactical_operator.glb';

gltfLoader.load(
  modelUrl,
  (gltf) => {
    characterMesh = gltf.scene;
    characterMesh.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        
        // Enhance tactical material
        if (!child.material || child.material.isMeshBasicMaterial) {
          child.material = new THREE.MeshStandardMaterial({
            color: 0x22252a,
            roughness: 0.4,
            metalness: 0.6,
          });
        }
      }
    });

    scene.add(characterMesh);
    loaderOverlay.style.opacity = '0';
    setTimeout(() => { loaderOverlay.style.display = 'none'; }, 400);

    // If skeletal animations exist
    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(characterMesh);
      const action = mixer.clipAction(gltf.animations[0]);
      action.play();
    }
  },
  undefined,
  (err) => {
    console.error('Error loading GLB:', err);
    loaderOverlay.innerHTML = `<div style="color:#ff4466;">Yuklashda xatolik yuz berdi: ${err.message}</div>`;
  }
);

// 4. Procedural Character Movement Synthesizer
// (Provides natural breathing, walking sway, sprint bob, and jump physics for real-time visualization)
const clock = new THREE.Clock();

function updateProceduralMotion(delta) {
  if (!characterMesh) return;

  animTime += delta;
  
  if (currentAnim === 'idle') {
    // Breathing subtle chest & shoulder displacement
    const breath = Math.sin(animTime * 2.2) * 0.008;
    characterMesh.position.y = breath;
    characterMesh.rotation.y += (autoRotate ? delta * 0.4 : 0);
    characterMesh.rotation.z = Math.sin(animTime * 1.5) * 0.005;
  } 
  else if (currentAnim === 'walk') {
    // Rhythmic tactical patrol march
    const walkFreq = 5.0;
    const bob = Math.abs(Math.sin(animTime * walkFreq)) * 0.035;
    const sway = Math.sin(animTime * (walkFreq * 0.5)) * 0.02;
    characterMesh.position.y = bob;
    characterMesh.rotation.z = sway;
    characterMesh.rotation.x = 0.04; // Slight forward lean
    characterMesh.rotation.y += (autoRotate ? delta * 0.6 : 0);
  } 
  else if (currentAnim === 'run') {
    // Energetic tactical sprint oscillation
    const runFreq = 9.0;
    const bob = Math.abs(Math.sin(animTime * runFreq)) * 0.07;
    const roll = Math.sin(animTime * (runFreq * 0.5)) * 0.045;
    characterMesh.position.y = bob;
    characterMesh.rotation.z = roll;
    characterMesh.rotation.x = 0.12; // Pronounced forward sprint lean
    characterMesh.rotation.y += (autoRotate ? delta * 0.8 : 0);
  } 
  else if (currentAnim === 'jump') {
    // Parabolic physics leap & landing
    const jumpCycle = (animTime * 1.8) % 2.0;
    if (jumpCycle < 1.0) {
      // Ascend and descend: 4 * h * t * (1 - t)
      const t = jumpCycle;
      const jumpY = 4 * 0.45 * t * (1.0 - t);
      characterMesh.position.y = jumpY;
      characterMesh.rotation.x = -0.06;
    } else {
      // Touchdown recovery
      characterMesh.position.y = 0;
      characterMesh.rotation.x = 0;
    }
    characterMesh.rotation.y += (autoRotate ? delta * 0.3 : 0);
  }
}

// 5. Animation Switcher
document.querySelectorAll('.btn-anim').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn-anim').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentAnim = btn.dataset.anim;
    animTime = 0;
    statAnim.innerText = currentAnim.toUpperCase();
  });
});

// 6. Tools UI Handlers
const btnWireframe = document.getElementById('btn-wireframe');
btnWireframe.addEventListener('click', () => {
  isWireframe = !isWireframe;
  btnWireframe.innerText = `Wireframe: ${isWireframe ? 'ON' : 'OFF'}`;
  btnWireframe.classList.toggle('active', isWireframe);
  if (characterMesh) {
    characterMesh.traverse((child) => {
      if (child.isMesh) child.material.wireframe = isWireframe;
    });
  }
});

const btnRotate = document.getElementById('btn-rotate');
btnRotate.addEventListener('click', () => {
  autoRotate = !autoRotate;
  btnRotate.innerText = `Auto-Rotate: ${autoRotate ? 'ON' : 'OFF'}`;
  btnRotate.classList.toggle('active', autoRotate);
});

let lightingMode = 0;
const btnLighting = document.getElementById('btn-lighting');
btnLighting.addEventListener('click', () => {
  lightingMode = (lightingMode + 1) % 3;
  if (lightingMode === 0) {
    btnLighting.innerText = 'Chiroq: Studio Cyber';
    keyLight.color.setHex(0x00f0ff);
    fillLight.color.setHex(0xff9933);
  } else if (lightingMode === 1) {
    btnLighting.innerText = 'Chiroq: Kunduzgi Oq';
    keyLight.color.setHex(0xffffff);
    fillLight.color.setHex(0xbbccdd);
  } else {
    btnLighting.innerText = 'Chiroq: Taktik Qizil';
    keyLight.color.setHex(0xff3355);
    fillLight.color.setHex(0x2244aa);
  }
});

const btnReset = document.getElementById('btn-reset');
btnReset.addEventListener('click', () => {
  camera.position.set(0, 1.3, 3.2);
  controls.target.set(0, 0.95, 0);
  controls.update();
});

// Window Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 7. Render Loop
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  updateProceduralMotion(delta);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
