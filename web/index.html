<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
  <title>Tower Defense: Last Grid — Cyber-Neon Strategy</title>
  <meta name="description" content="Cyber-Neon Tactical Tower Defense: 10 Maps, 5 Towers, 8 Enemies, 3 Bosses, 30 Waves, 4 Commander Skills, Endless Survival & Custom Map Editor.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00e5ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #05070d;
      color: #00e5ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, monospace, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #header-bar {
      width: 100%;
      max-width: 1280px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #090e1a;
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
    #header-bar .brand {
      font-weight: 800;
      color: #00e5ff;
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
    }
    #header-bar .meta {
      color: #78909c;
    }
    #header-bar .meta a {
      color: #00e5ff;
      text-decoration: none;
      font-weight: 600;
    }
    #header-bar .meta a:hover {
      text-decoration: underline;
    }
    #canvas-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 76px);
      max-width: 1280px;
      max-height: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border: 1px solid rgba(0, 229, 255, 0.3);
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.15);
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: crosshair;
    }
    #footer-bar {
      width: 100%;
      max-width: 1280px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #090e1a;
      border-top: 1px solid rgba(0, 229, 255, 0.2);
      font-size: 0.78rem;
      color: #546e7a;
    }
    #footer-bar .hotkeys {
      color: #00e5ff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #footer-bar .version {
      min-width: 90px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="header-bar">
    <div class="brand">⚡ TOWER DEFENSE: LAST GRID</div>
    <div class="meta">
      Engine: <span>Godot 4.3 + Web 2D</span> | 
      <a href="https://github.com/nematjanoovv-max/UI_UX_18_11_2026" target="_blank" rel="noopener">GitHub Source &amp; Releases</a>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
  </div>

  <div id="footer-bar">
    <div class="hotkeys">[1-5] Towers &bull; [Space] Wave &bull; [Z] EMP &bull; [X] Orbital &bull; [C] Overclock &bull; [V] Drone &bull; [U] Upgrade &bull; [S] Sell &bull; [T] Priority</div>
    <div class="version">v2.0.0 Pro</div>
  </div>

  <script src="game.js"></script>
</body>
</html>
