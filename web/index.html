  <div id="canvas-container">

  <!-- Automatic Cache Purge & Service Worker Updater -->
  <script>
    const LATEST_BUILD_TAG = 'v4.1.0_rev8';
    try {
      const currentTag = localStorage.getItem('lg_client_build_tag');
      if (currentTag !== LATEST_BUILD_TAG) {
        localStorage.setItem('lg_client_build_tag', LATEST_BUILD_TAG);
        if ('caches' in window) {
          caches.keys().then((keys) => {
            keys.forEach((k) => caches.delete(k));
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let r of registrations) {
              r.update();
            }
          });
        }
      }
    } catch (e) {}

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=4.1.0_rev7').then((reg) => {
          reg.update();
        }).catch(() => {});
      });
    }

    const unlockWebAudio = () => {
      if (window.audio) {
        window.audio.init();
        if (window.audio.ctx && window.audio.ctx.state === 'suspended') {
          window.audio.ctx.resume().catch(() => {});
        }
      }
      window.removeEventListener('pointerdown', unlockWebAudio);
      window.removeEventListener('keydown', unlockWebAudio);
      window.removeEventListener('touchstart', unlockWebAudio);
    };
    window.addEventListener('pointerdown', unlockWebAudio, { once: true });
    window.addEventListener('keydown', unlockWebAudio, { once: true });
    window.addEventListener('touchstart', unlockWebAudio, { once: true });
  </script>

  <!-- Portrait Rotation Prompt Overlay -->
  <div id="portrait-warning" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #070b14; z-index: 99999; flex-direction: column; align-items: center; justify-content: center; color: #00e5ff; font-family: 'Segoe UI', monospace; text-align: center; padding: 20px;">

    <div style="font-size: 14px; color: #94a3b8; max-width: 320px;">"Tower Defense: Last Grid" to'liq taktik qo'mondonlik uchun gorizontal rejimga moslashtirilgan.</div>
  </div>
  <style>
    @media (orientation: portrait) {
      #portrait-warning { display: flex !important; }
    }
    @keyframes rotatePhone {
      0%, 10% { transform: rotate(0deg); }
      50%, 60% { transform: rotate(-90deg); }
      90%, 100% { transform: rotate(0deg); }
    }
