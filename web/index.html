  <style>
    @font-face{font-family:"Orbitron";src:url("assets/fonts/Orbitron.woff2") format("woff2");font-weight:400 900;font-display:swap}
    :root{--blue:#4cc9f0;--violet:#b57bff;--orange:#ff9040;--bg:#050810;--panel:#0b1324;--text:#eaf6ff;--sub:#8fa8c4}
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: #00e5ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, monospace, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    #canvas-container {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #02040a;
      overflow: hidden;
      border: none;
      box-shadow: none;
      z-index: 1;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      touch-action: none;
      -webkit-touch-callout: none;
      cursor: crosshair;
      z-index: 2;
    }
    #mech-hangar-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      pointer-events: none;
      touch-action: none;
      z-index: 1;
    }

        /* =========================================================================
       MAIN MENU (v4.2.0 Clean Cyber Deck Layout - Target High-Fidelity HUD)
       ========================================================================= */
    #menu {
      position: fixed;
      inset: 0;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(6px, 1.6vh, 14px);
      padding: max(env(safe-area-inset-top), 18px) max(env(safe-area-inset-right), 36px) max(env(safe-area-inset-bottom), 12px) max(env(safe-area-inset-left), 14px);
      font-family: "Orbitron", "Rajdhani", system-ui, sans-serif;
      color: var(--text);
      background:
        linear-gradient(to top, rgba(0, 229, 255, 0.08) 0%, transparent 35%),
        repeating-linear-gradient(90deg, rgba(0, 229, 255, 0.025) 0px, rgba(0, 229, 255, 0.025) 1px, transparent 1px, transparent 55px),
        radial-gradient(ellipse at 28% 58%, #0f223f 0%, #070e1c 55%, #03050a 100%);
      user-select: none;
      z-index: 10;
    }
    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: clamp(4px, 1vh, 8px);
      border-bottom: 1px solid #1a2f4c;
      font-size: clamp(9px, 2.1vh, 13px);
      letter-spacing: .06em;
      color: var(--sub);
      white-space: nowrap;
    }
    .status b { color: var(--text); font-weight: 700; text-shadow: 0 0 4px rgba(0, 229, 255, 0.4); }
    .status .right { display: flex; gap: clamp(8px, 1.8vw, 16px); align-items: center; overflow: visible; flex-shrink: 0; }
    .dot { display: inline-block; width: .6em; height: .6em; border-radius: 50%; background: #37e08a; margin-right: .5em; box-shadow: 0 0 6px #37e08a; }

    /* Web Fullscreen Header Button with Radiant Cyber Neon Pulse */
    .header-fs-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: clamp(4px, 0.8vh, 7px) clamp(10px, 1.4vw, 16px);
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.25) 0%, rgba(11, 24, 48, 0.85) 100%);
      border: 1.8px solid #00e5ff;
      border-radius: 6px;
      color: #00e5ff;
      font-family: inherit;
      font-size: clamp(10px, 2vh, 12.5px);
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.35), inset 0 0 8px rgba(0, 229, 255, 0.15);
      transition: all 0.18s ease-in-out;
      user-select: none;
      -webkit-user-select: none;
      flex-shrink: 0;
      animation: neonPulse 2.5s infinite ease-in-out;
    }
    @keyframes neonPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(0, 229, 255, 0.3), inset 0 0 6px rgba(0, 229, 255, 0.15); border-color: #00e5ff; }
      50% { box-shadow: 0 0 18px rgba(0, 229, 255, 0.65), inset 0 0 12px rgba(0, 229, 255, 0.35); border-color: #38bdf8; }
    }
    .header-fs-btn:hover {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.4) 0%, rgba(20, 45, 80, 0.95) 100%);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.7), inset 0 0 14px rgba(0, 229, 255, 0.35);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .header-fs-btn:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 0 0 6px rgba(0, 229, 255, 0.3);
    }
    .header-fs-btn svg {
      width: clamp(14px, 2.2vh, 18px);
      height: clamp(14px, 2.2vh, 18px);
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 3px currentColor);
    }

    /* Floating Fullscreen Button for in-game & sub-menus */
    .floating-fs-btn {
      position: fixed;
      top: max(env(safe-area-inset-top), 10px);
      right: max(env(safe-area-inset-right), 12px);
      z-index: 99999;
      width: clamp(38px, 6vh, 46px);
      height: clamp(38px, 6vh, 46px);
      border-radius: 8px;
      border: 1.8px solid #00e5ff;
      background: rgba(7, 14, 28, 0.92);
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.4), inset 0 0 8px rgba(0, 229, 255, 0.2);
      backdrop-filter: blur(8px);
      color: #00e5ff;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease-in-out;
      user-select: none;
      -webkit-user-select: none;
      animation: neonPulse 2.5s infinite ease-in-out;
    }
    .floating-fs-btn:hover {
      background: rgba(0, 229, 255, 0.3);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.7);
      color: #ffffff;
      transform: scale(1.08);
    }
    .floating-fs-btn:active {
      transform: scale(0.94);
    }
    .floating-fs-btn svg {
      width: 58%;
      height: 58%;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 3px currentColor);
    }

    @media (max-width: 960px) {
      .cmd-info-badge { display: none !important; }
    }
    .stage {
      display: grid;
      grid-template-columns: 52% 1fr;
      gap: clamp(10px, 2vw, 24px);
      min-height: 0;
    }
    .hero {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }
    #robotCanvas {
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(-1 * max(env(safe-area-inset-left), 14px));
      width: calc(100% + max(env(safe-area-inset-left), 14px));
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    #robotCanvas:active { cursor: grabbing; }
    /* pure 3D hero - seamless open cyberspace */
    .modes {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(10px, 2.2vh, 18px);
      min-height: 0;
    }
    .mode {
      --c: var(--blue);
      position: relative;
      flex: 1 1 0;
      max-height: clamp(64px, 22vh, 110px);
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: clamp(12px, 2.2vw, 22px);
      padding: 0 clamp(14px, 2.4vw, 26px);
      border: 1.5px solid var(--c);
      clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
      background: linear-gradient(95deg, color-mix(in srgb, var(--c) 22%, #081120) 0%, color-mix(in srgb, var(--c) 7%, #040914) 100%);
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 0 16px color-mix(in srgb, var(--c) 35%, transparent), inset 0 0 14px color-mix(in srgb, var(--c) 15%, transparent);
      transition: transform .12s, filter .12s;
    }
    .mode::before {
      content: "";
      position: absolute;
      inset: 2px;
      border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
      clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
      pointer-events: none;
    }
    .mode.violet { --c: var(--violet); }
    .mode.orange { --c: var(--orange); }
    .mode:active { transform: scale(.98); filter: brightness(1.3); }

    .medallion {
      flex: 0 0 auto;
      width: clamp(42px, 8.8vh, 58px);
      height: clamp(42px, 8.8vh, 58px);
      border-radius: 50%;
      border: 2px solid var(--c);
      background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--c) 30%, #060e1c), #030812 75%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px color-mix(in srgb, var(--c) 55%, transparent), inset 0 0 8px color-mix(in srgb, var(--c) 35%, transparent);
    }
    .medallion svg {
      width: 58%;
      height: 58%;
      stroke: var(--c);
      fill: none;
      stroke-width: 1.8;
      filter: drop-shadow(0 0 4px var(--c));
    }
    .mode-text {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .mode-text .t {
      display: block;
      font-weight: 800;
      letter-spacing: .08em;
      font-size: clamp(14px, 3.4vh, 23px);
      text-shadow: 0 0 4px color-mix(in srgb, var(--c) 50%, transparent), 0 1px 2px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mode-text .s {
      display: block;
      margin-top: .2em;
      color: var(--sub);
      font-size: clamp(9px, 2vh, 12px);
      letter-spacing: .06em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tech-tag {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-left: 8px;
      opacity: 0.65;
    }
    .tech-tag span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 6px var(--c);
    }

    .dock {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      border: 1.5px solid #1a3354;
      border-radius: 8px;
      background: linear-gradient(180deg, #0d1a2d 0%, #060c18 100%);
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.12), inset 0 0 12px rgba(0, 229, 255, 0.05);
      overflow: hidden;
    }
    .dock button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(2px, .6vh, 6px);
      min-height: max(48px, 11vh);
      padding: 6px 2px;
      border: 0;
      background: transparent;
      color: var(--sub);
      font: inherit;
      font-size: clamp(8px, 1.8vh, 11.5px);
      letter-spacing: .06em;
      cursor: pointer;
      transition: background .12s, color .12s;
    }
    .dock button + button { border-left: 1px solid #162740; }
    .dock button:active { background: #142846; color: #00f0ff; }
    .dock svg {
      width: clamp(18px, 4.4vh, 28px);
      height: clamp(18px, 4.4vh, 28px);
      stroke: #7296be;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .12s, filter .12s;
    }
    .dock button:active svg {
      stroke: #00f0ff;
      filter: drop-shadow(0 0 5px #00f0ff);
    }
  </style>
</head>

  <!-- Button Action Wiring -->
  <script>
    document.querySelectorAll('[data-action]').forEach(function (el) {
      el.addEventListener('click', function () {
        document.dispatchEvent(new CustomEvent('menu:action', { detail: el.dataset.action }));
      });
    });

    document.addEventListener('menu:action', function (e) {
      const action = e.detail;
      if (!window.lastGridEngine) return;
      const engine = window.lastGridEngine;
      if (action === 'campaign') {
        engine.vibrate([25, 20, 35]);
        if (window.audio) window.audio.click();
        engine.startMission(0, 'CAMPAIGN');
      } else if (action === 'endless') {
        engine.vibrate([25, 20, 35]);
        if (window.audio) window.audio.click();
        engine.startMission(9, 'ENDLESS');
      } else if (action === 'bossrush') {
        engine.vibrate([25, 20, 45]);
        if (window.audio) window.audio.click();
        engine.startMission(0, 'BOSS_RUSH');
      } else if (action === 'map') {
        engine.vibrate(15);
        if (window.audio) window.audio.click();
        engine.state = 'MAP_SELECT';
      } else if (action === 'leaderboard') {
        engine.vibrate(15);
        if (window.audio) window.audio.click();
        engine.state = 'LEADERBOARD';
      } else if (action === 'achievements') {
        engine.vibrate(20);
        if (window.audio) window.audio.click();
        engine.state = 'ACHIEVEMENTS';

    // Web Fullscreen Button Controller & Synchronization
    (function () {
      const fsBtn = document.getElementById('web-fullscreen-btn');
      const floatBtn = document.getElementById('floating-fs-btn');

      function updateFloatingVisibility() {
        const menuEl = document.getElementById('menu');
        const isMenuVisible = menuEl && menuEl.style.display !== 'none';
        if (floatBtn) {
          floatBtn.style.display = isMenuVisible ? 'none' : 'flex';
        }
      }

      function syncFullscreenState() {
        const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
        [fsBtn, floatBtn].forEach((btn) => {
          if (!btn) return;
          const enterIcon = btn.querySelector('.fs-icon-enter');
          const exitIcon = btn.querySelector('.fs-icon-exit');
          const label = btn.querySelector('.fs-label');
          if (enterIcon) enterIcon.style.display = isFS ? 'none' : 'block';
          if (exitIcon) exitIcon.style.display = isFS ? 'block' : 'none';
          if (label) label.textContent = isFS ? 'CHIQISH' : 'FULL EKRAN';
          btn.setAttribute('title', isFS ? "To'liq ekrandan chiqish (Esc / F)" : "To'liq ekranga o'tish (F)");
        });
        updateFloatingVisibility();
        if (window.lastGridEngine && typeof window.lastGridEngine.resizeCanvas === 'function') {
          window.lastGridEngine.resizeCanvas();
        }
      }

      function handleFullscreenToggle(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        if (window.audio) window.audio.click();
        if (window.lastGridEngine && typeof window.lastGridEngine.toggleFullscreen === 'function') {
          window.lastGridEngine.toggleFullscreen();
        } else {
          const docEl = document.documentElement;
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            const rfs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
            if (rfs) rfs.call(docEl).catch(() => {});
          } else {
            const efs = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
            if (efs) efs.call(document).catch(() => {});
          }
        }
      }

      if (fsBtn) fsBtn.addEventListener('click', handleFullscreenToggle);
      if (floatBtn) floatBtn.addEventListener('click', handleFullscreenToggle);

      document.addEventListener('fullscreenchange', syncFullscreenState);
      document.addEventListener('webkitfullscreenchange', syncFullscreenState);

      // Periodically keep floating button state in sync with game menu visibility
      setInterval(updateFloatingVisibility, 250);

              }
            });
            heroModel.updateMatrixWorld(true);

            let box = new T.Box3().setFromObject(heroModel);
            let size = box.getSize(new T.Vector3());
            const rawH = size.y > 0 ? size.y : 1.0;
            // Larger commanding hero height: 2.45 units (enlarged from 2.05)
            const targetHeight = 2.45;
            const scaleFactor = targetHeight / rawH;
            heroModel.scale.setScalar(scaleFactor);

            heroModel.updateMatrixWorld(true);
            box = new T.Box3().setFromObject(heroModel);
            const center = box.getCenter(new T.Vector3());
            heroModel.position.x = -center.x;
            heroModel.position.z = -center.z;
            const baseY = box.min.y;
            heroModel.position.y = -baseY; // Soles of boots sit flush at y = 0
            heroModel.updateMatrixWorld(true);

            const heroRoot = new T.Group();
            heroRoot.add(heroModel);
            heroScene.add(heroRoot);

            // Initialize Studio-Grade AnimationMixer with Native & Mocap Clips
            let heroMixer = null;
            const heroActions = {};
            let activeAction = null;

            const origClip = (gltf.animations && gltf.animations.length) ? gltf.animations[0] : null;
            const bakedClips = window.MEGATRON_CLIPS || {};

            if (T.AnimationClip) {
              try {
                heroMixer = new T.AnimationMixer(heroModel);

                // 1. Native High-Fidelity 397-track Idle from megatron.glb (0s - 4.0s)
                let idleClip = null;
                if (origClip && T.AnimationUtils && T.AnimationUtils.subclip) {
                  idleClip = T.AnimationUtils.subclip(origClip, 'Idle', 0, 120, 30);
                } else if (bakedClips.AimIdle && T.AnimationClip.parse) {
                  idleClip = T.AnimationClip.parse(bakedClips.AimIdle);
                } else if (bakedClips.Idle && T.AnimationClip.parse) {
                  idleClip = T.AnimationClip.parse(bakedClips.Idle);
                }

                // 2. Mocap Locomotion Walk & Run (Mixamo Shooter Pack)
                const walkClip = (bakedClips.Walk && T.AnimationClip.parse) ? T.AnimationClip.parse(bakedClips.Walk) : null;
                const runClip = (bakedClips.Run && T.AnimationClip.parse) ? T.AnimationClip.parse(bakedClips.Run) : null;

                // 3. Fusion Cannon Recoil & Blast (Mixamo Shooter Pack firing rifle)
                const shootClip = (bakedClips.Shoot && T.AnimationClip.parse) ? T.AnimationClip.parse(bakedClips.Shoot) : (origClip && T.AnimationUtils && T.AnimationUtils.subclip ? T.AnimationUtils.subclip(origClip, 'Shoot', 210, 255, 30) : null);

                // 4. Melee Authentic Greatsword Cleave (Dark Energon Blade)
                const slashClip = (bakedClips.Slash && T.AnimationClip.parse) ? T.AnimationClip.parse(bakedClips.Slash) : null;
                const spinClip = (bakedClips.SpinSlash && T.AnimationClip.parse) ? T.AnimationClip.parse(bakedClips.SpinSlash) : null;

                // 5. Ultimate Airborne Leap & Seismic Ground Slam
                const slamClip = (bakedClips.Slam && T.AnimationClip.parse) ? T.AnimationClip.parse(bakedClips.Slam) : (origClip && T.AnimationUtils && T.AnimationUtils.subclip ? T.AnimationUtils.subclip(origClip, 'Slam', 120, 195, 30) : null);

                // 6. Dark Energon Core Power-Up & Shield Aura
                const powerUpClip = (bakedClips.PowerUp && T.AnimationClip.parse) ? T.AnimationClip.parse(bakedClips.PowerUp) : null;

                if (idleClip) heroActions.idle = heroMixer.clipAction(idleClip);
                if (walkClip) heroActions.walk = heroMixer.clipAction(walkClip);
                if (runClip) heroActions.run = heroMixer.clipAction(runClip);
                if (shootClip) {
                  heroActions.shoot = heroMixer.clipAction(shootClip);
                  heroActions.shoot.setLoop(T.LoopOnce, 1);
                  heroActions.shoot.clampWhenFinished = true;
                }
                if (slashClip) {
                  heroActions.slash = heroMixer.clipAction(slashClip);
                  heroActions.slash.setLoop(T.LoopOnce, 1);
                  heroActions.slash.clampWhenFinished = true;
                  heroActions.slash.timeScale = 2.6; // High-velocity mecha blade cleave
                }
                if (spinClip) {
                  heroActions.spin = heroMixer.clipAction(spinClip);
                  heroActions.spin.setLoop(T.LoopOnce, 1);
                  heroActions.spin.clampWhenFinished = true;
                  heroActions.spin.timeScale = 2.2;
                }
                if (slamClip) {
                  heroActions.slam = heroMixer.clipAction(slamClip);
                  heroActions.slam.setLoop(T.LoopOnce, 1);
                  heroActions.slam.clampWhenFinished = true;
                  heroActions.slam.timeScale = 2.0; // Explosive seismic impact
                }
                if (powerUpClip) {
                  heroActions.powerUp = heroMixer.clipAction(powerUpClip);
                  heroActions.powerUp.setLoop(T.LoopOnce, 1);
                  heroActions.powerUp.clampWhenFinished = true;
                }

                if (heroActions.idle) {
                  heroActions.idle.play();
                  activeAction = heroActions.idle;
                }
                console.log('[Hero3D] 6 Combat Animation Clips initialized successfully: Idle, Walk, Run, Shoot, Slash, Slam!');
              } catch (clipErr) {
                console.warn('[Hero3D] Failed initializing animation clips:', clipErr);
              }
            }

            function setAction(newAction, duration) {
              if (!newAction || newAction === activeAction) return;
              const d = duration || 0.2;
              if (activeAction) activeAction.fadeOut(d);
              newAction.reset().fadeIn(d).play();
              activeAction = newAction;
            }

            let currentAngle = 0;
            let shootRecoil = 0;
            let lFootPlant = 0.5;
            let rFootPlant = 0.5;
            let justStepped = null;
            let lastStep = null;

            window.Hero3D = {
              ready: true,
              canvas: heroCanvas,
              renderer: heroRenderer,
              scene: heroScene,
              camera: heroCamera,
              root: heroRoot,
              model: heroModel,
              mixer: heroMixer,
              actions: heroActions,
              cannonLight: cannonLight,
              getFootData: function () {
                const step = justStepped;
                justStepped = null;
                return { lPlant: lFootPlant, rPlant: rFootPlant, justStepped: step };
              },
              update: function (dt, isMoving, targetAngle, shootFlash, isDashing, isUlting, moveSpeed, isSlashing) {
                // 1. Robotic Angular Turntable Inertia
                let diff = targetAngle - currentAngle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                const turnRate = diff * Math.min(1.0, dt * 18.0);
                currentAngle += turnRate;
                heroRoot.rotation.y = -currentAngle;

                // 2. Ultimate Seismic Ground Slam Action
                if (isUlting && heroActions.slam) {
                  if (!heroActions.slam.isRunning()) {
                    if (activeAction && activeAction !== heroActions.slam) activeAction.fadeOut(0.12);
                    heroActions.slam.reset().fadeIn(0.12).play();
                    activeAction = heroActions.slam;
                  }
                }

                // 3. Melee Dark Energon Blade Cleave Action
                if (isSlashing && heroActions.slash) {
                  if (!heroActions.slash.isRunning()) {
                    if (activeAction && activeAction !== heroActions.slash) activeAction.fadeOut(0.08);
                    heroActions.slash.reset().fadeIn(0.08).play();
                    activeAction = heroActions.slash;
                  }
                }

                // 4. Heavy Fusion Cannon Recoil & Blast Action
                if (shootFlash > 0) {
                  shootRecoil = Math.max(shootRecoil, shootFlash);
                  if (heroActions.shoot && !isUlting && !isSlashing) {
                    heroActions.shoot.reset().play();
                  }
                }
                if (shootRecoil > 0) shootRecoil = Math.max(0, shootRecoil - dt * 5.5);

                // 5. Mocap Locomotion State Machine & Root-Motion Synchronization
                if (heroMixer && activeAction) {
                  let speedScale = 1.0;
                  const isAttacking = (isUlting && heroActions.slam && heroActions.slam.isRunning()) ||
                                      (isSlashing && heroActions.slash && heroActions.slash.isRunning());

                  if (!isAttacking) {
                    if (isMoving) {
                      if (isDashing) {
                        setAction(heroActions.run, 0.15);
                        speedScale = 1.25;
                      } else {
                        setAction(heroActions.walk, 0.20);
                        speedScale = 1.0;
                      }
                    } else {
                      setAction(heroActions.idle, 0.25);
                      speedScale = 1.0;
                    }
                  }

                  heroMixer.update(dt * speedScale);

                  // 6. Ground Contact Lock & Footstep Impact Timing
                  if (activeAction === heroActions.walk || activeAction === heroActions.run) {
                    const duration = activeAction.getClip().duration;
                    const tNorm = (activeAction.time % duration) / duration;
                    lFootPlant = Math.cos(tNorm * Math.PI * 2) * 0.5 + 0.5;
                    rFootPlant = 1.0 - lFootPlant;

                    if (tNorm > 0.45 && tNorm < 0.55 && lastStep !== 'L') {
                      justStepped = 'L';
                      lastStep = 'L';
                    } else if ((tNorm < 0.05 || tNorm > 0.95) && lastStep !== 'R') {
                      justStepped = 'R';
                      lastStep = 'R';
                    } else if (tNorm > 0.15 && tNorm < 0.35) {
                      lastStep = null;
                    }
                  } else {
                    lFootPlant = 0.5;
                    rFootPlant = 0.5;
                    justStepped = null;
                  }
                }

                // 7. Heavy Cybertronian Warlord Kinematics & Dynamic Recoil
                heroModel.rotation.z = -turnRate * 0.25;
                heroModel.position.x = 0;
                heroModel.position.y = -baseY + (isUlting ? 0.40 : 0);

                // Authentic Fusion Cannon Blast Recoil (Dynamic kick on firing)
                if (shootRecoil > 0) {
                  const rSh = heroModel.getObjectByName('R_Arm02_Shoulder_XB_041');
                  if (rSh && !isSlashing && !isUlting) {
                    rSh.rotation.x -= shootRecoil * 0.55;
                  }
                }

                // Thruster Jet Forward Lean & Cannon Recoil Kickback
                const forwardLean = isDashing ? 0.38 : (isMoving ? 0.12 : 0);
                heroModel.rotation.x = forwardLean - shootRecoil * 0.15;
                heroModel.position.z = -shootRecoil * 0.25;

                // 8. Dynamic Muzzle Flash & Dark Energon Lighting
                if (isUlting) {
                  cannonLight.color.setHex(0xc084fc);
                  cannonLight.intensity = 24.0;
                } else if (isSlashing) {
                  cannonLight.color.setHex(0xe879f9);
                  cannonLight.intensity = 18.0;
                } else {
                  cannonLight.color.setHex(0xff2244);
                  cannonLight.intensity = (shootRecoil > 0) ? (shootRecoil * 18.0) : 1.2;
                }
              },
              renderToCanvas: function () {
                heroRenderer.render(heroScene, heroCamera);
                return heroCanvas;
              }
            };
            console.log('[Hero3D] In-Game Tactical 3D Hero ready! WebGL buffer: 200x200, Scale: 2.45h');
          } catch (e) {
            console.warn('[Hero3D] Error initializing Hero3D:', e);
          }
        }

        const loader = new LoaderClass();

        function loadViaNetwork() {
          loader.load(
            MODEL_URL,
            function (gltf) {
              applyModel(gltf, MODEL_URL);
            },
            undefined,
            function (err) {
              console.warn('[MainMenu3D] Failed loading ' + MODEL_URL + ', trying fallback model: ' + FALLBACK_MODEL_URL, err);
              loader.load(
                FALLBACK_MODEL_URL,
                function (gltf2) {
                  applyModel(gltf2, FALLBACK_MODEL_URL);
                },
                undefined,
                function (err2) {
                  console.error('[MainMenu3D] Both GLB files failed. Model yuklanmadi:', err2);
                  showModelError(new Error("GLB yuklanmadi"));
                }
              );
            }
          );
        }

        function startLoading() {
          try {
            if (window.AndroidBridge && (typeof window.AndroidBridge.getMegatronModelBase64 === 'function' || typeof window.AndroidBridge.getModelBase64 === 'function')) {
              let b64 = null;
              if (typeof window.AndroidBridge.getMegatronModelBase64 === 'function') {
                b64 = window.AndroidBridge.getMegatronModelBase64();
              } else if (typeof window.AndroidBridge.getModelBase64 === 'function') {
                b64 = window.AndroidBridge.getModelBase64('megatron.glb');
              }
              if (b64 && b64.length > 1000) {
                console.log('[MainMenu3D] Loading megatron.glb via AndroidBridge Base64 (' + b64.length + ' chars)...');
                const binaryString = atob(b64);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                  bytes[i] = binaryString.charCodeAt(i);
                }
                loader.parse(
                  bytes.buffer,
                  '',
                  function (gltf) {
                    console.log('[MainMenu3D] AndroidBridge base64 parsed successfully!');
                    applyModel(gltf, 'AndroidBridge:megatron.glb');
                  },
                  function (parseErr) {
                    console.warn('[MainMenu3D] AndroidBridge parse error, falling back to network:', parseErr);
                    loadViaNetwork();
                  }
                );
                return;
              }
            }
          } catch (e) {
            console.warn('[MainMenu3D] AndroidBridge load exception:', e);
          }
          loadViaNetwork();
        }

        startLoading();

        function resize() {
          const w = (canvas && canvas.clientWidth) ? canvas.clientWidth : (host && host.clientWidth ? host.clientWidth : (window.innerWidth ? Math.round(window.innerWidth * 0.55) : 400));
          const h = (canvas && canvas.clientHeight) ? canvas.clientHeight : (host && host.clientHeight ? host.clientHeight : (window.innerHeight ? Math.round(window.innerHeight * 0.8) : 500));
          if (!w || !h) return;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;

          // Adaptive horizontal FOV compensation: guarantees full visibility of extended weapon tip on any screen
          const targetAspect = 1.25;
          const baseFovRad = 38 * Math.PI / 180;
          if (camera.aspect < targetAspect) {
            const hFov = 2 * Math.atan(Math.tan(baseFovRad / 2) * targetAspect);
            camera.fov = 2 * Math.atan(Math.tan(hFov / 2) / camera.aspect) * (180 / Math.PI);
          } else {
            camera.fov = 38;
          }
          camera.updateProjectionMatrix();
        }
        const ro = (typeof ResizeObserver !== 'undefined') ? new ResizeObserver(resize) : null;
        if (ro && host) ro.observe(host);
        if (ro && canvas) ro.observe(canvas);
        window.addEventListener('resize', resize);
        resize();

        // Interactive 360-degree Hand/Touch Drag Rotation for Megatron
        const DEFAULT_ROT_Y = -Math.PI / 2;
        let currentRotY = DEFAULT_ROT_Y;
        let targetRotY = DEFAULT_ROT_Y;
        let isDragging = false;
        let lastPointerX = 0;
        let dragVelocity = 0;
        let hasDragged = false;
        let lastTapTime = 0;

        function handlePointerStart(clientX, pointerId) {
          isDragging = true;
          hasDragged = false;
          lastPointerX = clientX;
          dragVelocity = 0;
          if (pointerId !== undefined && canvas.setPointerCapture) {
            try { canvas.setPointerCapture(pointerId); } catch (_) {}
          }
        }

        function handlePointerMove(clientX) {
          if (!isDragging) return;
          const dx = clientX - lastPointerX;
          lastPointerX = clientX;
          if (Math.abs(dx) > 1) hasDragged = true;
          const sensitivity = 0.0075;
          targetRotY += dx * sensitivity;
          dragVelocity = dx * sensitivity;
        }

        function handlePointerEnd(pointerId) {
          if (!isDragging) return;
          isDragging = false;
          if (pointerId !== undefined && canvas.releasePointerCapture) {
            try { canvas.releasePointerCapture(pointerId); } catch (_) {}
          }
          if (!hasDragged) {
            const now = Date.now();
            if (now - lastTapTime < 350) {
              targetRotY = DEFAULT_ROT_Y;
              dragVelocity = 0;
              lastTapTime = 0;
              camera.position.set(0, 1.95, 6.45);
            } else {
              lastTapTime = now;
            }
          }
        }

        // Wheel zoom (Desktop/Mouse)
        canvas.addEventListener('wheel', function (e) {
          e.preventDefault();
          const zoomDelta = e.deltaY * 0.004;
          camera.position.z = Math.max(5.0, Math.min(8.5, camera.position.z + zoomDelta));
        }, { passive: false });

        // Touch pinch-to-zoom (Mobile)
        let initialPinchDist = 0;
        let initialCamZ = 6.45;

        canvas.addEventListener('touchstart', function (e) {
          if (e.touches.length === 2) {
            isDragging = false;
            initialPinchDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            initialCamZ = camera.position.z;
          }
        }, { passive: true });

        canvas.addEventListener('touchmove', function (e) {
          if (e.touches.length === 2 && initialPinchDist > 0) {
            const currentDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            const factor = initialPinchDist / (currentDist || 1);
            camera.position.z = Math.max(5.0, Math.min(8.5, initialCamZ * factor));
          }
        }, { passive: true });

        canvas.addEventListener('touchend', function (e) {
          if (e.touches.length < 2) {
            initialPinchDist = 0;
          }
        }, { passive: true });

        if (window.PointerEvent) {
          canvas.addEventListener('pointerdown', function (e) {
            handlePointerStart(e.clientX, e.pointerId);
          });
          window.addEventListener('pointermove', function (e) {
            handlePointerMove(e.clientX);
          });
          window.addEventListener('pointerup', function (e) {
            handlePointerEnd(e.pointerId);
          });
          window.addEventListener('pointercancel', function (e) {
            handlePointerEnd(e.pointerId);
          });
        } else {
          canvas.addEventListener('touchstart', function (e) {
            if (e.touches.length > 0) handlePointerStart(e.touches[0].clientX);
          }, { passive: true });
          window.addEventListener('touchmove', function (e) {
            if (e.touches.length > 0) handlePointerMove(e.touches[0].clientX);
          }, { passive: true });
          window.addEventListener('touchend', function () {
            handlePointerEnd();
          });
          window.addEventListener('touchcancel', function () {
            handlePointerEnd();
          });
          canvas.addEventListener('mousedown', function (e) {
            handlePointerStart(e.clientX);
          });
          window.addEventListener('mousemove', function (e) {
            handlePointerMove(e.clientX);
          });
          window.addEventListener('mouseup', function () {
            handlePointerEnd();
          });
        }

        const clock = new T.Clock();
        let raf = 0;
        let running = false;

        function frame() {
          raf = requestAnimationFrame(frame);
          const dt = Math.min(clock.getDelta(), 0.05);
          const dt60 = dt * 60;
          const t = clock.elapsedTime;

          // Slow counter-rotation of neon rings
          ringOuter.rotation.z += 0.005 * dt60;
          ringMiddle.rotation.z -= 0.008 * dt60;
          ringInner.rotation.z += 0.004 * dt60;

          // Subtle pulsation on neon rings
          const pulse = 0.85 + 0.15 * Math.sin(t * 3.0);
          ringOuter.material.opacity = pulse;
          ringMiddle.material.opacity = 0.80 + 0.18 * Math.cos(t * 2.6);

          // Update Megatron GLB skeletal animation smoothly
          if (mixer) {
            mixer.update(dt);
          }

          // Interactive 360-degree rotation with inertia and smooth lerp
          if (!isDragging) {
            dragVelocity *= 0.92;
            if (Math.abs(dragVelocity) < 0.00005) dragVelocity = 0;
            targetRotY += dragVelocity;
          }
          currentRotY += (targetRotY - currentRotY) * 0.15;
          robotRoot.rotation.y = currentRotY;
          robotRoot.position.x = 0;
          robotRoot.position.y = 0;

          // Ascending neon particles
          const arr = pGeo.attributes.position.array;
          for (let i = 0; i < P; i++) {
            arr[i * 3 + 1] += pSpeed[i] * dt;
            if (arr[i * 3 + 1] > 5.5) arr[i * 3 + 1] = 0;
          }
          pGeo.attributes.position.needsUpdate = true;
          renderer.render(scene, camera);
        }

        function start() {
          if (running) return;
          running = true;
          clock.start();
          frame();
        }
        function stop() {
          running = false;
          cancelAnimationFrame(raf);
        }
        function dispose() {
          stop();
          if (ro) ro.disconnect();
          window.removeEventListener('resize', resize);
          scene.traverse(function (o) {
            if (o.geometry) o.geometry.dispose();
            if (o.material) {
              const mats = Array.isArray(o.material) ? o.material : [o.material];
              mats.forEach(function (m) {
                for (const k in m) { if (m[k] && m[k].isTexture) m[k].dispose(); }
                m.dispose();
              });
            }
          });
          renderer.dispose();
          if (typeof renderer.forceContextLoss === 'function') renderer.forceContextLoss();
        }

        document.addEventListener('visibilitychange', function () {
          if (document.hidden) {
            stop();
          } else if (canvas && canvas.style.display !== 'none' && !canvas.hidden) {
            start();
          }
        });

        window.MainMenu3D = { start: start, stop: stop, dispose: dispose, renderer: renderer, scene: scene, camera: camera };
        start();
      }

      window.initMainMenu3D = initMainMenu3D;

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initMainMenu3D);
      } else {
        initMainMenu3D();
      }
    })();
  </script>

  <script>
    const unlockWebAudio = () => {

        window.audio.init();
        if (window.audio.ctx && window.audio.ctx.state === 'suspended') {
          window.audio.ctx.resume().catch(() => {});
        }
      }
      try {
        const el = document.documentElement;
        const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if (rfs && !document.fullscreenElement && !document.webkitFullscreenElement) {
          rfs.call(el).catch(() => {});
        }
      } catch (e) {}
      window.removeEventListener('pointerdown', unlockWebAudio);
      window.removeEventListener('keydown', unlockWebAudio);
      window.removeEventListener('touchstart', unlockWebAudio);
    };
    window.addEventListener('pointerdown', unlockWebAudio, { once: true });
    window.addEventListener('keydown', unlockWebAudio, { once: true });
    window.addEventListener('touchstart', unlockWebAudio, { once: true });
  </script>
