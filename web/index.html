<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>Tower Defense: Last Grid</title>
  <meta name="description" content="Cyber-Neon Tactical Tower Defense Game with 10 Maps, 5 Towers, 8 Enemies, 3 Bosses, and 30 Waves.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #05070d;
      color: #00e5ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, monospace, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #header-bar {
      width: 100%;
      max-width: 1280px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #090e1a;
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
    #header-bar .brand {
      font-weight: 800;
      color: #00e5ff;
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
    }
    #header-bar .meta {
      color: #78909c;
    }
    #header-bar .meta a {
      color: #00e5ff;
      text-decoration: none;
      font-weight: 600;
    }
    #header-bar .meta a:hover {
      text-decoration: underline;
    }
    #canvas-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 76px);
      max-width: 1280px;
      max-height: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border: 1px solid rgba(0, 229, 255, 0.3);
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.15);
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: crosshair;
    }
    #footer-bar {
      width: 100%;
      max-width: 1280px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #090e1a;
      border-top: 1px solid rgba(0, 229, 255, 0.2);
      font-size: 0.8rem;
      color: #546e7a;
    }
    #footer-bar .hotkeys {
      color: #00e5ff;
    }
  </style>
</head>
<body>
  <div id="header-bar">
    <div class="brand">⚡ TOWER DEFENSE: LAST GRID</div>
    <div class="meta">
      Engine: <span>Godot 4.3 + Web 2D</span> | 
      <a href="https://github.com/nematjanoovv-max/UI_UX_18_11_2026" target="_blank" rel="noopener">GitHub Source &amp; Releases</a>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
  </div>

  <div id="footer-bar">
    <div class="hotkeys">Hotkeys: [1-5] Towers &bull; [Space] Next Wave &bull; [U] Upgrade &bull; [S] Sell (70%) &bull; [T] Target &bull; [Esc] Pause</div>
    <div class="version">v1.0.0 Release</div>
  </div>

  <script src="game.js"></script>
</body>
</html>
