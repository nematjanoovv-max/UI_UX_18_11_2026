<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tower Defense: Last Grid</title>
<script type="importmap">
{ "imports": { "three": "./assets/lib/three.module.js", "three/addons/": "./assets/lib/" } }
</script>
<style>
@font-face{font-family:"Orbitron";src:url("assets/fonts/Orbitron.woff2") format("woff2");font-weight:400 900;font-display:swap}
:root{--blue:#4cc9f0;--violet:#b57bff;--orange:#ff9040;--bg:#050810;--panel:#0b1324;--text:#eaf6ff;--sub:#8fa8c4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden}
#menu{position:fixed;inset:0;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:clamp(6px,1.6vh,14px);padding:max(env(safe-area-inset-top),8px) max(env(safe-area-inset-right),12px) max(env(safe-area-inset-bottom),8px) max(env(safe-area-inset-left),12px);font-family:"Orbitron","Rajdhani",system-ui,sans-serif;color:var(--text);background:radial-gradient(ellipse at 25% 55%,#10213d 0%,#070c18 55%,#03050a 100%);user-select:none}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:clamp(4px,1vh,8px);border-bottom:1px solid #1c2a40;font-size:clamp(9px,2.1vh,13px);letter-spacing:.06em;color:var(--sub);white-space:nowrap}
.status b{color:var(--text);font-weight:700}
.status .right{display:flex;gap:clamp(8px,2vw,18px);align-items:center;overflow:hidden}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#37e08a;margin-right:.5em}
.stage{display:grid;grid-template-columns:40% 1fr;gap:clamp(8px,2vw,24px);min-height:0}
.hero{position:relative;min-height:0}
#robotCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#robotFallback{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.modes{display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,2vh,16px);min-height:0}
.mode{--c:var(--blue);position:relative;flex:1 1 0;max-height:clamp(64px,22vh,120px);min-height:48px;display:flex;align-items:center;gap:clamp(10px,2vw,18px);padding:0 clamp(12px,2.4vw,24px);border:2px solid var(--c);border-radius:10px;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 22%,transparent),color-mix(in srgb,var(--c) 6%,transparent));color:var(--text);font:inherit;text-align:left;cursor:pointer;box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 18%,transparent);transition:transform .12s,filter .12s}
.mode::before,.mode::after{content:"";position:absolute;width:14px;height:14px;border:3px solid var(--c)}
.mode::before{top:-3px;left:-3px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.mode::after{bottom:-3px;right:-3px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.mode.violet{--c:var(--violet)}
.mode.orange{--c:var(--orange)}
.mode:active{transform:scale(.97);filter:brightness(1.35)}
.mode svg{flex:0 0 auto;width:clamp(26px,6.5vh,44px);height:clamp(26px,6.5vh,44px);stroke:var(--c);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mode .t{display:block;font-weight:800;letter-spacing:.07em;font-size:clamp(14px,3.6vh,24px)}
.mode .s{display:block;margin-top:.25em;color:var(--sub);font-size:clamp(9px,2vh,13px);letter-spacing:.05em}
.dock{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid #22344f;border-radius:10px;background:var(--panel);overflow:hidden}
.dock button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(2px,.7vh,6px);min-height:max(48px,11vh);padding:6px 2px;border:0;background:transparent;color:var(--sub);font:inherit;font-size:clamp(8px,1.9vh,12px);letter-spacing:.05em;cursor:pointer;transition:background .12s,color .12s}
.dock button+button{border-left:1px solid #1a2a42}
.dock button:active{background:#13233f;color:var(--text)}
.dock svg{width:clamp(18px,4.6vh,30px);height:clamp(18px,4.6vh,30px);stroke:var(--text);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="menu">
  <header class="status">
    <b>TOWER DEFENSE: LAST GRID</b>
    <div class="right">
      <span>v4.2.0</span>
      <span><i class="dot"></i>GRID ONLINE</span>
      <span>KOMANDIR: <b id="cmdName">CYBERCOMMANDER</b> ★★★</span>
    </div>
  </header>

  <main class="stage">
    <section class="hero">
      <canvas id="robotCanvas"></canvas>
      <img id="robotFallback" src="assets/robot.webp" alt="" hidden>
    </section>
    <section class="modes">
      <button class="mode" data-action="campaign">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 2 5 5 5 9l-2 3H9l-2-3c0-4 2-7 5-9z"/><path d="M9 15l-3 4M15 15l3 4"/><circle cx="12" cy="9.5" r="1.5"/></svg>
        <span><span class="t">KAMPANIYA</span><span class="s">10 TA XARITA</span></span>
      </button>
      <button class="mode violet" data-action="endless">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.739-8-4.585 0-4.585 8 0 8 5.606 0 7.644-8 12.74-8z"/></svg>
        <span><span class="t">CHEKSIZ REJIM</span><span class="s">TO'LQINLAR TUGAMAYDI</span></span>
      </button>
      <button class="mode orange" data-action="bossrush">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 0 0-8 8c0 3 1.5 4.5 3 5.5V20h10v-2.5c1.5-1 3-2.5 3-5.5a8 8 0 0 0-8-8z"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><path d="M11 20v-2M13 20v-2"/></svg>
        <span><span class="t">BOSS RUSH DUEL</span><span class="s">FAQAT BOSSLAR</span></span>
      </button>
    </section>
  </main>

  <nav class="dock">
    <button data-action="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>XARITA</button>
    <button data-action="leaderboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/></svg>REYTING</button>
    <button data-action="achievements"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M9 14l-2 8 5-3 5 3-2-8"/></svg>YUTUQLAR</button>
    <button data-action="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>SOZLAMALAR</button>
    <button data-action="apk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10h10v8a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/><path d="M8 10a4 4 0 0 1 8 0M9 4l1 2M15 4l-1 2"/></svg>APK</button>
  </nav>
</div>

<script>
document.querySelectorAll('[data-action]').forEach(function (el) {
  el.addEventListener('click', function () {
    document.dispatchEvent(new CustomEvent('menu:action', { detail: el.dataset.action }));
  });
});
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MODEL_URL = 'assets/models/megatron.glb';

const canvas = document.getElementById('robotCanvas');
const fallback = document.getElementById('robotFallback');
const host = canvas.parentElement;

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 1.9, 7.2);
camera.lookAt(0, 1.5, 0);

scene.add(new THREE.HemisphereLight(0x9fb8ff, 0x140a22, 0.7));
const key = new THREE.DirectionalLight(0x6fd8ff, 2.2);
key.position.set(3, 4, 5);
scene.add(key);
const rim = new THREE.DirectionalLight(0xb57bff, 2.6);
rim.position.set(-4, 3, -4);
scene.add(rim);
const spot = new THREE.SpotLight(0xbfe9ff, 60, 14, 0.5, 0.6, 1.5);
spot.position.set(0, 7, 0.5);
spot.target.position.set(0, 0, 0);
scene.add(spot, spot.target);

const stand = new THREE.Group();
scene.add(stand);

const disc = new THREE.Mesh(
  new THREE.CylinderGeometry(1.9, 2.0, 0.14, 64),
  new THREE.MeshStandardMaterial({ color: 0x0c1220, metalness: 0.8, roughness: 0.35 })
);
disc.position.y = -0.07;
stand.add(disc);

const ringBlue = new THREE.Mesh(
  new THREE.RingGeometry(1.62, 1.78, 96),
  new THREE.MeshBasicMaterial({ color: 0x4cc9f0, side: THREE.DoubleSide })
);
ringBlue.rotation.x = -Math.PI / 2;
ringBlue.position.y = 0.01;
const ringViolet = new THREE.Mesh(
  new THREE.RingGeometry(1.15, 1.27, 96),
  new THREE.MeshBasicMaterial({ color: 0xb57bff, side: THREE.DoubleSide })
);
ringViolet.rotation.x = -Math.PI / 2;
ringViolet.position.y = 0.012;
stand.add(ringBlue, ringViolet);

const beam = new THREE.Mesh(
  new THREE.CylinderGeometry(0.7, 1.8, 6, 40, 1, true),
  new THREE.MeshBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.07, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending })
);
beam.position.y = 3;
stand.add(beam);

const P = 30;
const pPos = new Float32Array(P * 3);
const pSpeed = new Float32Array(P);
for (let i = 0; i < P; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 0.4 + Math.random() * 1.8;
  pPos[i * 3] = Math.cos(a) * r;
  pPos[i * 3 + 1] = Math.random() * 5;
  pPos[i * 3 + 2] = Math.sin(a) * r;
  pSpeed[i] = 0.2 + Math.random() * 0.4;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const particles = new THREE.Points(
  pGeo,
  new THREE.PointsMaterial({ color: 0x8fe3ff, size: 0.05, transparent: true, opacity: 0.8, depthWrite: false })
);
stand.add(particles);

const robotRoot = new THREE.Group();
stand.add(robotRoot);
let model = null;
let mixer = null;

new GLTFLoader().load(
  MODEL_URL,
  function (gltf) {
    model = gltf.scene;
    let box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    model.scale.setScalar(3.3 / Math.max(size.y, 0.0001));
    box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.x -= center.x;
    model.position.z -= center.z;
    model.position.y -= box.min.y;
    robotRoot.add(model);
    if (gltf.animations && gltf.animations.length) {
      mixer = new THREE.AnimationMixer(model);
      const idle = gltf.animations.find(function (c) { return /idle/i.test(c.name); }) || gltf.animations[0];
      mixer.clipAction(idle).play();
    }
  },
  undefined,
  function (err) {
    console.error('GLB yuklanmadi:', MODEL_URL, err);
    canvas.hidden = true;
    fallback.hidden = false;
  }
);

function resize() {
  const w = host.clientWidth;
  const h = host.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
const ro = new ResizeObserver(resize);
ro.observe(host);
resize();

const clock = new THREE.Clock();
let raf = 0;
let running = false;

function frame() {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (mixer) mixer.update(dt);
  robotRoot.rotation.y += 0.004 * (dt * 60);
  robotRoot.position.y = 0.04 + Math.sin(t * 1.4) * 0.05;
  ringBlue.rotation.z += 0.004 * (dt * 60);
  ringViolet.rotation.z -= 0.007 * (dt * 60);
  const arr = pGeo.attributes.position.array;
  for (let i = 0; i < P; i++) {
    arr[i * 3 + 1] += pSpeed[i] * dt;
    if (arr[i * 3 + 1] > 5) arr[i * 3 + 1] = 0;
  }
  pGeo.attributes.position.needsUpdate = true;
  renderer.render(scene, camera);
}

function start() {
  if (running) return;
  running = true;
  clock.start();
  frame();
}
function stop() {
  running = false;
  cancelAnimationFrame(raf);
}
function dispose() {
  stop();
  ro.disconnect();
  scene.traverse(function (o) {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(function (m) {
        for (const k in m) { if (m[k] && m[k].isTexture) m[k].dispose(); }
        m.dispose();
      });
    }
  });
  renderer.dispose();
  renderer.forceContextLoss();
}

document.addEventListener('visibilitychange', function () {
  if (document.hidden) { stop(); } else if (!canvas.hidden) { start(); }
});

window.MainMenu3D = { start: start, stop: stop, dispose: dispose };
start();
</script>
</body>
</html>
