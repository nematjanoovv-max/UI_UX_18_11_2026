services:
  - type: web
    name: last-grid-leaderboard
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: LEADERBOARD_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
